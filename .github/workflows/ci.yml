name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  swift:
    name: Swift tests and macOS bundle
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build_app_bundle.sh

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaDa-Network-Discover-macOS
          path: dist/VaDa-Network-Discover-macOS.zip
