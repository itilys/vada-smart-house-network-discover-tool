name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build and publish macOS release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build_app_bundle.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/VaDa-Network-Discover-macOS.zip \
            --title "VaDa Network Discover $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
